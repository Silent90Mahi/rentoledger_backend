# Production-like stack for the API: MongoDB (single-node replica set) + RentOLedger API.
#
#   export JWT_ACCESS_SECRET=$(openssl rand -hex 32) OTP_SECRET=$(openssl rand -hex 32)
#   docker compose up --build -d
#   curl http://localhost:4000/ready
#
# Optional demo data (only on a fresh, empty database):
#   docker compose exec api node dist/src/db/cli.js seed --force
#
# SMS: codes are written to the API log (`docker compose logs api`) until you set
# SMS_PROVIDER=twilio with TWILIO_* credentials and ALLOW_CONSOLE_SMS_IN_PRODUCTION=false.
#
# For a managed database, remove the `mongo` service and set MONGODB_URI to your
# MongoDB Atlas connection string.

services:
  mongo:
    image: mongo:7
    # Transactions need a replica set; a single member is enough.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodata:/data/db
    healthcheck:
      # Initialises the replica set on first start, then reports healthy once it has a primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGODB_DB: rentoledger
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET, e.g. export JWT_ACCESS_SECRET=$$(openssl rand -hex 32)}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET, e.g. export OTP_SECRET=$$(openssl rand -hex 32)}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      ALLOW_CONSOLE_SMS_IN_PRODUCTION: ${ALLOW_CONSOLE_SMS_IN_PRODUCTION:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-4000}:4000"
    restart: unless-stopped

volumes:
  mongodata:
